plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id 'net.neoforged.gradle.userdev' version '7.0.133'
    id 'com.diffplug.spotless' version '6.23.3'
}

if (project.file('../gradletools.gradle').exists()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/1.20_tech/gradletools.gradle'
}

repositories {
    mavenLocal()
    maven { url "https://dvs1.progwml6.com/files/maven" } // JEI
    maven { url "https://maven.blamejared.com" } // Patchouli
    maven { url "https://maven.k-4u.nl" } // McJtyLib, TOP
    maven { url "https://maven.theillusivec4.top/" } // Curios
}

version = '1.0'
group = 'com.yourname.modid'
archivesBaseName = 'modid'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

    runs {
        configureEach {
            workingDirectory project.file('run')
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

//            modSource project(':NovaCore').sourceSets.main
//            modSource project(':ExNihiloSequentia').sourceSets.main
//            modSource project(':ExNihiloCraftTweaker').sourceSets.main
//            modSource project(':ExNihiloJade').sourceSets.main
//            modSource project(':ExNihiloJEI').sourceSets.main
//            modSource project(':ExNihiloTOP').sourceSets.main
//            modSource project(':ExNihiloKubeJs').sourceSets.main
//            modSource project(':ExNihiloMekanism').sourceSets.main
//            modSource project(':ExNihiloThermal').sourceSets.main
//            modSource project(':ExNihiloAE').sourceSets.main
        }

        client {
        }

        server {
        }

        data {
            programArguments.addAll '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', sourceSets.main.resources.srcDirs[0].absolutePath
        }
    }

jars()

dependencies {
    mc()
    jei()

//    implementation project(':NovaCore')
//    implementation project(':ExNihiloSequentia')
//    implementation project(':ExNihiloCraftTweaker')
//    implementation project(':ExNihiloJade')
//    implementation project(':ExNihiloJEI')
//    implementation project(':ExNihiloTOP')
//    implementation project(':ExNihiloKubeJs')
//    implementation project(':ExNihiloMekanism')
//    implementation project(':ExNihiloThermal')
//    implementation project(':ExNihiloAE')
}

// Example configuration to allow publishing using the maven-publish task
// we define a custom artifact that is sourced from the reobfJar output task
// and then declare that to be published
// Note you'll need to add a repository here
def reobfFile = file("$buildDir/reobfJar/output.jar")
def reobfArtifact = artifacts.add('default', reobfFile) {
    type 'jar'
    builtBy 'reobfJar'
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact reobfArtifact
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
